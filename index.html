<!doctype html>
<!--
  STADIUM — la pagina del link "sfida un amico" (D145, 09/10/2026)
  Va pubblicata su GitHub Pages in un repository PUBBLICO a parte
  (Epischope77/star_strek-sfida): qui niente codice del gioco, solo la pagina.
  Il link condiviso è corto: https://epischope77.github.io/star_strek-sfida/?s=100968xv1
  (9 ottobre, 6 indizi su 8, un tiro sbagliato poi il gol, un aiuto: i
  quadratini li rifà la pagina). Capisce anche i link vecchi ?d=…&q=….
  Il tris (D146): ?s=1010Tx--ox---x = 10 ottobre, le nove caselle (x ❌, o ⭕, - vuota).
  Il tasto apre l'app sulla sfida del giorno (stadium://sfida, passando
  dall'intent di Android: se l'app non c'è, Chrome apre la pagina dello store).
-->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stadium · Sfida del giorno</title>
<meta property="og:title" content="Stadium · Sfida del giorno">
<meta property="og:description" content="Un calciatore misterioso, uguale per tutti. Due tiri. Ci riesci?">
<style>
  :root { --sfondo: #081226; --pannello: #0e1f3d; --bordo: #1c3766; --oro: #ffd700; --testo: #ffffff; --tenue: rgba(207,224,255,0.7); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--sfondo); color: var(--testo);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display: flex; align-items: center; justify-content: center; padding: 16px; }
  main { width: 100%; max-width: 420px; text-align: center; }
  h1 { color: var(--oro); font-size: 28px; letter-spacing: 1px; margin: 0 0 6px; }
  .data { color: var(--tenue); margin-bottom: 18px; }
  .scheda { background: var(--pannello); border: 1px solid var(--bordo); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
  .mister { font-size: 40px; }
  .quadratini { font-size: 26px; letter-spacing: 2px; margin: 12px 0; word-break: break-all; white-space: pre-line; line-height: 1.25; }
  p { line-height: 1.5; margin: 8px 0; }
  .tasto { display: block; background: var(--oro); color: #1a1200; font-weight: 900; font-size: 20px;
           text-decoration: none; border-radius: 14px; padding: 16px; margin: 14px 0 8px; letter-spacing: 1px; }
  .nota { color: var(--tenue); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>📅 SFIDA DEL GIORNO</h1>
  <div class="data" id="data"></div>
  <div class="scheda">
    <div class="mister">🧢</div>
    <p id="invito">Un tuo amico ti sfida: c'è un calciatore misterioso, uguale per tutti. Scopri gli indizi e indovina chi è. Hai solo <b>due tiri</b>.</p>
    <div class="quadratini" id="quadratini"></div>
    <p class="nota" id="spiega"></p>
  </div>
  <a class="tasto" id="tasto" href="stadium://sfida">GIOCA ANCHE TU</a>
  <p class="nota" id="nota">Si apre l'app Stadium. Se non ce l'hai ancora, presto la trovi sullo store.</p>
</main>
<script>
  // i dati arrivano dal link. Nessun nome: è una sfida.
  var p = new URLSearchParams(location.search);
  var d = p.get('d') || '';
  var q = p.get('q') || '';
  // il codice corto: MMGG, indizi aperti, indizi totali (base 36), tiri (x v t), aiuti
  var c = /^(\d{2})(\d{2})([0-9a-z])([0-9a-z])([xvt]{0,3})(\d?)$/.exec(p.get('s') || '');
  if (c) {
    var oggi = new Date(), anno = oggi.getFullYear();
    if (Number(c[1]) > oggi.getMonth() + 1) anno -= 1;   // un link di dicembre letto a gennaio
    d = anno + '-' + c[1] + '-' + c[2];
    var n = parseInt(c[3], 36), tot = parseInt(c[4], 36);
    if (tot >= 1 && tot <= 12 && n <= tot) {
      q = new Array(n + 1).join('🟨') + new Array(tot - n + 1).join('⬛') + ' '
        + c[5].replace(/x/g, '🟥').replace(/v/g, '🟩').replace(/t/g, '⏱️')
        + (Number(c[6]) > 0 ? ' ' + new Array(Number(c[6]) + 1).join('💡') : '');
    }
  }
  // il tris: MMGG + T + nove caselle
  var t = /^(\d{2})(\d{2})T([xo-]{9})$/.exec(p.get('s') || '');
  var tris = !!t;
  if (t) {
    var oggiT = new Date(), annoT = oggiT.getFullYear();
    if (Number(t[1]) > oggiT.getMonth() + 1) annoT -= 1;
    d = annoT + '-' + t[1] + '-' + t[2];
    var segni = { x: '❌', o: '⭕', '-': '⬜' };
    q = [0, 3, 6].map(function (i) { return t[3].slice(i, i + 3).split('').map(function (k) { return segni[k]; }).join(''); }).join('\n');
    document.getElementById('invito').innerHTML = 'Un tuo amico ti sfida al <b>tris del giorno</b>: nove caselle, in ognuna un calciatore misterioso. Indovinalo e la casella è tua ❌, sbaglia ed è ⭕. Fai tris!';
  }
  if (/^\d{4}-\d{2}-\d{2}$/.test(d)) {
    var parti = d.split('-');
    document.getElementById('data').textContent = 'del ' + parti[2] + '/' + parti[1] + '/' + parti[0];
  }
  if (q && q.length < 80) {
    document.getElementById('quadratini').textContent = q;
    document.getElementById('spiega').textContent = tris
      ? 'Il suo risultato: ❌ giocatore preso, ⭕ mancato, ⬜ casella non giocata.'
      : 'Il suo risultato: 🟨 indizi aperti, 🟥 tiri sbagliati, 🟩 gol, 💡 aiuti usati.';
  }
  // Android: l'intent apre l'app sulla sfida, o lo store se l'app non c'è
  if (/android/i.test(navigator.userAgent)) {
    document.getElementById('tasto').href =
      'intent://sfida#Intent;scheme=stadium;package=com.epischope.stadiumapp;end';
  }
</script>
</body>
</html>
